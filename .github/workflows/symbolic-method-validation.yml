name: Symbolic Method Validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/thermostat-symbolic-machine
    paths:
      - "src/clarity/certification/constraint_logic.py"
      - "src/clarity/certification/structural_markov.py"
      - "src/clarity/certification/structural_discretization.py"
      - "src/clarity/certification/structural_rule_validation.py"
      - "src/clarity/certification/markov_logic.py"
      - "src/clarity/certification/markov_rule_validation.py"
      - "src/clarity/certification/method_implementation_validation.py"
      - "src/clarity/certification/proof_logic_validation.py"
      - "src/clarity/certification/discretization_semantic_validation.py"
      - "src/clarity/certification/ot_markov.py"
      - "scripts/validate_symbolic_methods.py"
      - "tests/certification/validate_constraint_logic.py"
      - "src/clarity/models/**/*.sysml"
      - "tests/fixtures/standalone/*.sysml"
      - ".github/workflows/symbolic-method-validation.yml"
  pull_request:
    paths:
      - "src/clarity/certification/constraint_logic.py"
      - "src/clarity/certification/structural_markov.py"
      - "src/clarity/certification/structural_discretization.py"
      - "src/clarity/certification/structural_rule_validation.py"
      - "src/clarity/certification/markov_logic.py"
      - "src/clarity/certification/markov_rule_validation.py"
      - "src/clarity/certification/method_implementation_validation.py"
      - "src/clarity/certification/proof_logic_validation.py"
      - "src/clarity/certification/discretization_semantic_validation.py"
      - "src/clarity/certification/ot_markov.py"
      - "scripts/validate_symbolic_methods.py"
      - "tests/certification/validate_constraint_logic.py"
      - "src/clarity/models/**/*.sysml"
      - "tests/fixtures/standalone/*.sysml"
      - ".github/workflows/symbolic-method-validation.yml"

permissions:
  contents: read

concurrency:
  group: symbolic-method-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned certification dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Check logic IR construction
        run: PYTHONPATH=src python tests/certification/validate_constraint_logic.py -v

      - name: Validate all symbolic proof methods once
        run: PYTHONPATH=src python scripts/validate_symbolic_methods.py
