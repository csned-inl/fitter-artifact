[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-artifact"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "PyYAML==6.0.3",
    "scipy==1.18.1",
    "torch==2.13.0",
    "z3-solver==4.15.4.0",
]

[project.scripts]
clarity-fit = "clarity.pipeline.runner:main"
clarity-evaluate-rule = "clarity.pipeline.affine_rule:main"
clarity-certify-markov = "clarity.pipeline.markov_mdp:main"
clarity-certify-discretization = "clarity.pipeline.discretization_safety:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clarity.models" = ["**/*.sysml"]
